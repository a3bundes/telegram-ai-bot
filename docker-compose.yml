services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  bot:
    build: .
    container_name: telegram-ai-bot
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./sessions:/code/sessions
      - ./active_chats.json:/code/active_chats.json
      - ./memory.db:/code/memory.db
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: